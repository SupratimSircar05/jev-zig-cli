name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 22 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Reject credential-shaped material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E '(sk-or-v1-[A-Za-z0-9_-]{24,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{24,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!src/redact.zig'; then
            echo 'credential-shaped material found in repository' >&2
            exit 1
          fi
      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          invalid="$(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows \
            | awk -F@ 'NF == 2 && $2 !~ /^[0-9a-f]{40}$/ { print }')"
          test -z "$invalid" || { echo "$invalid" >&2; exit 1; }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, SSPL-1.0

  scorecard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: results.sarif
