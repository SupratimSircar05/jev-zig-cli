name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 22 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  repository-hygiene:
    name: Security / Repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject credential-shaped material
        shell: bash
        run: |
          set -euo pipefail
          if git grep -I -n -E '(sk-or-v1-[A-Za-z0-9_-]{24,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{24,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)' -- . ':!src/redact.zig'; then
            echo 'credential-shaped material found in repository' >&2
            exit 1
          fi
      - name: Require immutable action references
        shell: bash
        run: |
          set -euo pipefail
          invalid="$(grep -RhoE 'uses:[[:space:]]+[^[:space:]#]+' .github/workflows \
            | awk -F@ 'NF == 2 && $2 !~ /^[0-9a-f]{40}$/ { print }')"
          test -z "$invalid" || { echo "$invalid" >&2; exit 1; }

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, SSPL-1.0

  codeql:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}

  scorecard:
    if: github.event_name != 'pull_request'
    needs: codeql
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif

  required:
    name: Security / Required
    if: always()
    needs: [repository-hygiene, dependency-review, codeql]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require repository hygiene and CodeQL to pass
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY_HYGIENE_RESULT: ${{ needs.repository-hygiene.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          test "$REPOSITORY_HYGIENE_RESULT" = success
          test "$CODEQL_RESULT" = success
          if [[ "$EVENT_NAME" == pull_request ]]; then
            test "$DEPENDENCY_REVIEW_RESULT" = success
          else
            test "$DEPENDENCY_REVIEW_RESULT" = skipped
          fi
