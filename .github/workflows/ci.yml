name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  native:
    name: ${{ matrix.os }} / Zig 0.16.0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Format check
        run: zig fmt --check build.zig src
      - name: Unit and contract tests
        run: zig build test -j4
      - name: ReleaseSafe build
        run: zig build -Doptimize=ReleaseSafe -j4
      - name: Artifact smoke test
        shell: bash
        env:
          OPENROUTER_API_KEY: ci-placeholder-not-a-credential
        run: |
          ./zig-out/bin/jevx version
          ./zig-out/bin/jevx policy explain --json
          ./zig-out/bin/jev-decide --health

  cross-compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux-musl
          - x86_64-linux-musl
          - x86_64-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }} -j4

  parser-fuzz:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Bounded parser fuzzing
        shell: bash
        run: |
          # --fuzz is a Zig build-runner option. ReleaseSafe avoids a known
          # Debug-only compiler test-runner issue in Zig 0.16.0.
          zig build test -Doptimize=ReleaseSafe -j4 --fuzz=1K

  repository-hygiene:
    name: CI / Repository hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Reject credential-shaped material
        shell: bash
        run: |
          if git grep -I -n -E '(sk-or-v1-[A-Za-z0-9_-]{24,}|Authorization:[[:space:]]*Bearer[[:space:]]+[A-Za-z0-9._-]{24,})' -- . ':!src/redact.zig' ':!tests'; then
            echo 'credential-shaped material found in repository'
            exit 1
          fi
      - name: No non-Zig project source
        shell: bash
        run: |
          unexpected=$(find src tests scripts -type f 2>/dev/null | grep -Ev '\.(zig|json|jsonl|md)$' || true)
          test -z "$unexpected" || { echo "$unexpected"; exit 1; }
      - name: Validate installer and Pages source
        shell: bash
        run: |
          set -euo pipefail
          sh -n install.sh
          shellcheck install.sh
          for required in index.html 404.html app.js styles.css favicon.svg; do
            test -s "site/$required"
          done
          node --check site/app.js
          if find site -type l -print -quit | grep -q .; then
            echo 'site must not contain symbolic links' >&2
            exit 1
          fi
          if find site -type f -links +1 -print -quit | grep -q .; then
            echo 'site must not contain hard links' >&2
            exit 1
          fi
          git diff --check

  required:
    name: CI / Required
    if: always()
    needs: [native, cross-compile, parser-fuzz, repository-hygiene]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every CI job to pass
        shell: bash
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          CROSS_COMPILE_RESULT: ${{ needs.cross-compile.result }}
          PARSER_FUZZ_RESULT: ${{ needs.parser-fuzz.result }}
          REPOSITORY_HYGIENE_RESULT: ${{ needs.repository-hygiene.result }}
        run: |
          set -euo pipefail
          test "$NATIVE_RESULT" = success
          test "$CROSS_COMPILE_RESULT" = success
          test "$PARSER_FUZZ_RESULT" = success
          test "$REPOSITORY_HYGIENE_RESULT" = success
